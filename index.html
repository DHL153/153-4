<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Merge & Roll - PC/Mobile Idle Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Pretendard', 'Segoe UI', sans-serif; }
        
        body { 
            margin: 0; padding: 0; background: #2b2b2b; 
            display: flex; justify-content: center; align-items: center; 
            height: 100dvh; width: 100vw; overflow: hidden;
            color: #4a4e69; user-select: none; touch-action: none;
        }

        #app {
            width: 100%; max-width: 420px; height: 100dvh; 
            background: rgba(253, 251, 247, 1); position: relative;
            display: flex; flex-direction: column;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5); overflow: hidden;
        }

        @media (min-width: 421px) {
            #app { height: 800px; border-radius: 12px; border: 4px solid #d2bce3; }
        }

        @keyframes mergeShake { 0% { transform: translate(1px, 1px) rotate(0deg); } 50% { transform: translate(-1px, -1px) rotate(-1deg); } 100% { transform: translate(0, 0) rotate(0deg); } }
        .merge-shake { animation: mergeShake 0.15s ease-in-out; }
        .shake-active { animation: mergeShake 0.1s infinite; }
        
        @keyframes whiteFlash { 0% { transform: translate(-50%, -50%) scale(0.6); opacity: 1; filter: brightness(2); background: rgba(255,255,255,1); } 100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; background: rgba(255,255,255,0); } }
        @keyframes ringExpand { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; border: 4px solid rgba(255,255,255,0.9); } 100% { transform: translate(-50%, -50%) scale(2.0); opacity: 0; border: 1px solid rgba(255,255,255,0); } }

        /* ================= [ 상단 바 ] ================= */
        #top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #fff; border-bottom: 2px solid #e8dff5; flex-shrink: 0; z-index: 20; }
        .top-stats { display: flex; gap: 8px; align-items: center; width: 100%; justify-content: flex-end;}
        .stat-badge { background: #fdfbf7; padding: 6px 10px; border-radius: 10px; font-size: 14px; font-weight: bold; border: 1px solid #e8dff5; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .stat-badge.gold { color: #d35400; } .stat-badge.merge { color: #6a4c9c; }

        /* ================= [ SPA 뷰 컨테이너 구조 ] ================= */
        #main-content { flex: 1; position: relative; width: 100%; height: 100%; overflow: hidden; background: #fdfbf7; }
        .view-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; overflow: hidden; }
        .view-container.active { display: flex; }

        /* ================= [ 뷰 1: 전투 (시작 화면) ] ================= */
        #board-section { flex-shrink: 0; height: 160px; background: #e8dff5; position: relative; border-bottom: 4px solid #b9a0e6; display: flex; justify-content: center; align-items: center; padding: 5px 10px; z-index: 10; }
        
        #battle-stage { 
            width: 100%; height: 145px; 
            background: url('images/bg/bt/bt_bg01.png') center center / 100% 100% no-repeat;
            background-color: #2c2c2c; border: 3px solid #b9a0e6; border-radius: 12px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; 
        }
        
        .hero { height: 90px; width: auto; object-fit: contain; transition: all 0.15s ease-out; transform-origin: center bottom; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5)); z-index: 5; }
        .hero.attack { transform: translateX(60px) rotate(15deg) scale(1.2); }
        .character.enemy { font-size: 65px; line-height: 1; transition: all 0.2s ease-out; opacity: 0; transform: translateX(50px); filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5)); }
        .character.enemy.slide-in { transform: translateX(0); opacity: 1; }
        .character.enemy.explode { animation: explodeAnim 0.4s forwards ease-out; }
        
        .hit-effect-sprite { position: absolute; right: 40px; top: 50%; transform: translateY(-50%) scale(0.5); font-size: 60px; opacity: 0; pointer-events: none; z-index: 10; animation: hitFlash 0.3s ease-out forwards; }
        @keyframes hitFlash { 0% { transform: translateY(-50%) scale(0.5); opacity: 1; } 50% { transform: translateY(-50%) scale(1.5); opacity: 1; } 100% { transform: translateY(-50%) scale(2); opacity: 0; } }
        @keyframes explodeAnim { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4) rotate(-15deg); opacity: 0.8; filter: drop-shadow(0 0 15px #ff4757); } 100% { transform: scale(2) rotate(15deg); opacity: 0; filter: blur(4px); } }

        #game-section { flex: 1; position: relative; overflow: hidden; touch-action: none; background-color: #fdfbf7; }
        
        #merge-box { position: absolute; top: 10px; bottom: 10px; left: 10px; right: 10px; border-radius: 12px; overflow: hidden; touch-action: none; cursor: crosshair; }
        #physics-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('images/bg/merge/merge_bg01.png') center center / 100% 100% no-repeat; z-index: 0; pointer-events: none; }
        #physics-guide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('images/bg/merge/merge_guide01.png') center center / 100% 100% no-repeat; pointer-events: none; z-index: 10; }

        #physics-area { position: absolute; top: 45px; bottom: 15px; left: 15px; right: 15px; z-index: 5; pointer-events: none; }
        #physics-area canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        #preview-ball { position: absolute; top: 20px; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 20; display: none; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        #drop-line { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; border-left: 2px dashed #b9a0e6; pointer-events: none; display: none; z-index: 5; transform: translateX(-50%); }
        #deadline-line { position: absolute; top: 35px; left: 0; right: 0; height: 2px; border-bottom: 2px dashed #ff70a6; z-index: 4; pointer-events: none; }
        
        #warning-banner { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; border: 2px solid white; display: none; z-index: 15; animation: pulse 0.5s infinite alternate; background: #ff477e; box-shadow: 0 4px 10px rgba(255, 71, 126, 0.4); pointer-events: none;}
        @keyframes pulse { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.05); } }

        #ui-section { flex-shrink: 0; background: #f9f0ff; padding: 10px 15px; display: flex; flex-direction: column; border-top: 4px solid #d2bce3; z-index: 10; }
        .item-group { display: flex; justify-content: space-between; align-items: stretch; gap: 8px; }
        .btn-item { flex: 1; padding: 8px 0; border: 2px solid #fff; border-radius: 10px; font-size: 12px; font-weight: 900; color: #4a4e69; cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: all 0.1s; }
        .btn-item:active { transform: translateY(4px); box-shadow: 0 0 0 transparent !important; }
        .btn-item span.icon-main { font-size: 18px; margin-bottom: 2px; display: block; }
        .cost-label { font-size: 11px; color: #d81b60; margin-top: 4px; font-weight: 900;}
        
        .btn-mult { background: #d1c4e9; box-shadow: 0 4px 0 #9575cd; justify-content: center; }
        .btn-hammer { background: #82ccdd; box-shadow: 0 4px 0 #60a3bc; } 
        .btn-shake { background: #f6e58d; box-shadow: 0 4px 0 #f4d03f; } 
        .btn-tornado { background: #b8e994; box-shadow: 0 4px 0 #78e08f; } 
        .btn-auto { flex: 1.2; background: #fff; box-shadow: 0 4px 0 #b2bec3; border: 2px solid #d2bce3; transform: scale(1.05); margin: 0 4px;}
        .btn-auto.active { background: #4fc3f7; color: white; box-shadow: 0 0 0 transparent; border-color:#fff; transform: scale(1.05) translateY(4px); }

        /* ================= [ 제네릭 뷰 스타일 & 패널 ] ================= */
        .view-title { background: #cda8e6; color: white; text-align: center; padding: 15px; font-size: 18px; font-weight: bold; box-shadow: 0 4px 10px rgba(185, 160, 230, 0.4); flex-shrink: 0; z-index:10; }
        .view-content { padding: 20px; flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 40px;}
        .panel { background: #fff; border: 2px solid #e8dff5; border-radius: 16px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .panel-title { font-size: 16px; font-weight: 900; color: #6a4c9c; border-bottom: 2px dashed #e8dff5; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;}
        
        .action-btn-main { width: 100%; background: #b9f6ca; border: 2px solid #69f0ae; border-radius: 12px; padding: 15px; font-size: 16px; font-weight: 900; color: #1b5e20; cursor: pointer; box-shadow: 0 4px 0 #69f0ae; transition: all 0.1s; margin-bottom: 15px; text-align: center; display: flex; justify-content: center; align-items: center; gap: 8px;}
        .action-btn-main:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
        .action-btn-main:disabled { background: #eee; border-color: #ccc; color: #999; box-shadow: 0 4px 0 #ccc; cursor: not-allowed; }
        .action-btn-sub { flex: 1; background: #fdfbf7; border: 2px solid #e8dff5; border-radius: 8px; padding: 10px; font-weight: bold; color: #6a4c9c; cursor: pointer; box-shadow: 0 4px 0 #e8dff5; transition: all 0.1s; }
        .action-btn-sub:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }

        .inventory-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .inv-item { background: #fdfbf7; border: 2px solid #e8dff5; border-radius: 12px; padding: 8px 5px; display: flex; flex-direction: column; align-items: center; position: relative; cursor: pointer; transition: transform 0.1s;}
        .inv-item:active:not(.unowned) { transform: scale(0.95); }
        .inv-item.unowned { filter: grayscale(1); opacity: 0.4; cursor: not-allowed; }
        .inv-item.selected { border-color: #d81b60; background: #fff0f5; box-shadow: 0 0 10px rgba(216, 27, 96, 0.3); }
        .inv-item .emoji { font-size: 26px; margin-bottom: 2px; }
        .inv-item .skin-img-icon { width: 35px; height: 35px; object-fit: contain; margin-bottom: 2px; }
        .inv-item .count { position: absolute; top: -5px; right: -5px; background: #ff477e; color: #fff; font-size: 10px; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 2px solid #fff; z-index: 2;}
        
        .tier-label { font-size: 9px; font-weight: 900; padding: 2px 4px; border-radius: 6px; color: #fff; margin-bottom:2px;}
        .tier-SS { background: #d35400; } .tier-S { background: #e67e22; } .tier-A { background: #9b59b6; } .tier-B { background: #3498db; } .tier-C { background: #95a5a6; }

        /* ================= [ 뷰 2: 캐릭터 꾸미기 뷰 ] ================= */
        #view-character { flex-direction: column; height: 100%; background: #fff; }
        .char-custom-layout { display: flex; flex-direction: row; height: 100%; width: 100%; }
        
        #char-preview-zone { flex: 1; position: relative; background: #e8dff5; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #char-preview-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; transition: all 0.3s;}
        #char-preview-body { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 2; padding: 20px; transition: all 0.3s;}
        
        #char-toggle-btn {
            position: absolute; right: 0; top: 50%; transform: translateY(-50%); z-index: 20;
            background: rgba(255,255,255,0.9); color: #6a4c9c;
            border: 2px solid #e8dff5; border-right: none; border-radius: 12px 0 0 12px;
            width: 28px; height: 50px; font-size: 16px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center; padding: 0; box-shadow: -2px 0 5px rgba(0,0,0,0.15); transition: all 0.2s;
        }
        #char-toggle-btn:active { background: #fdfbf7; }

        #char-item-zone { width: 160px; background: #fff; border-left: 2px solid #e8dff5; display: flex; flex-direction: column; transition: width 0.3s, opacity 0.3s; }
        #char-item-title { padding: 12px; font-size: 14px; font-weight: 900; text-align: center; background: #fdfbf7; border-bottom: 2px solid #e8dff5; color: #6a4c9c; }
        #char-item-list { flex: 1; overflow-y: auto; padding: 10px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; align-content: start; }
        .char-item-btn { aspect-ratio: 1; border: 2px solid #e8dff5; border-radius: 8px; background: #fafafa; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 12px; font-weight: bold; color: #b9a0e6; overflow: hidden; position: relative; transition: all 0.1s; }
        .char-item-btn:active { transform: scale(0.95); }
        .char-item-btn.selected { border-color: #d81b60; background: #fff0f5; box-shadow: 0 0 8px rgba(216, 27, 96, 0.3); }
        .char-item-btn img { width: 100%; height: 100%; object-fit: cover; pointer-events: none;}
        .char-item-btn.contain-mode img { object-fit: contain; padding: 4px; }

        #char-cat-zone { width: 70px; background: #fdfbf7; border-left: 2px solid #e8dff5; overflow-y: auto; display: flex; flex-direction: column; }
        .cat-tab { padding: 14px 5px; text-align: center; font-size: 13px; font-weight: bold; color: #b2bec3; cursor: pointer; border-bottom: 1px solid #e8dff5; transition: all 0.2s; word-break: keep-all; }
        .cat-tab.active { background: #d2bce3; color: #fff; border-bottom-color: #b9a0e6; }

        /* ================= [ 뷰 3: 구슬 스킨 뷰 ] ================= */
        #view-skin { flex-direction: column; height: 100%; background: #fdfbf7; }
        #skin-bg-container { flex-shrink: 0; width: 100%; height: 25%; position: relative; background: #e8dff5; display: flex; align-items: center; justify-content: center; border-bottom: 4px solid #b9a0e6; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #skin-display-img { height: 100px; width: 100px; object-fit: contain; animation: floatSkin 3s ease-in-out infinite; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3)); display: none; }
        @keyframes floatSkin { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .skin-equip-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .skin-slot { background: #eee; border: 2px dashed #ccc; border-radius: 50%; aspect-ratio: 1; display: flex; justify-content: center; align-items: center; position: relative; cursor: pointer; transition: all 0.1s; }
        .skin-slot:active { transform: scale(0.95); }
        .skin-slot .level-badge { position: absolute; bottom: -5px; background: #6a4c9c; color: #fff; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 10px; border: 1px solid #fff; z-index: 5; }
        .skin-slot img { width: 90%; height: 90%; object-fit: contain; border-radius: 50%; pointer-events: none; }

        /* ================= [ 아이템 합성 UI ] ================= */
        .craft-slots-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 15px; background: #f9f0ff; padding: 10px; border-radius: 12px; border: 2px solid #e8dff5;}
        .craft-slot { background: #fff; border: 2px dashed #d2bce3; border-radius: 8px; aspect-ratio: 1; display: flex; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; position: relative;}
        .craft-slot:active { transform: scale(0.95); }
        .craft-slot.filled { border-style: solid; border-color: #3498db; background: #e1f5fe; }
        
        /* ================= [ 하단 네비게이션 ] ================= */
        #bottom-nav { flex-shrink: 0; height: 70px; background: #fff; border-top: 2px solid #e8dff5; display: flex; justify-content: space-around; align-items: center; z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; height: 100%; color: #b2bec3; font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .nav-item .icon { font-size: 24px; margin-bottom: 4px; transition: transform 0.2s; filter: grayscale(1); opacity: 0.6; }
        .nav-item.active { color: #d81b60; }
        .nav-item.active .icon { transform: translateY(-4px) scale(1.1); filter: grayscale(0); opacity: 1; }

        .floating-text { position: absolute; font-weight: bold; font-size: 20px; color: #fff; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; pointer-events: none; z-index: 5000; animation: floatUp 1s forwards ease-out; white-space: nowrap; text-align: center; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.3); } }

        /* ================= [ 오버레이 공통 & 팝업 ] ================= */
        .overlay { position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(0, 0, 0, 0.85); color: #fff; display: flex; justify-content: center; align-items: center; flex-direction: column; z-index: 4500; display: none; backdrop-filter: blur(5px); }
        .action-btn { margin-top:10px; padding: 12px 24px; font-size:15px; border-radius:12px; border:2px solid #b9a0e6; background:#1dd1a1; color:white; font-weight:bold; cursor:pointer; transition: all 0.1s; box-shadow: 0 4px 0 #10ac84; width: 220px; }
        .action-btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent !important; }
        
        #event-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:4500; display:none; }
        #event-result { position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); flex-direction:column; align-items:center; justify-content:center; width:100%; z-index:5000; text-align:center; color:white; display:none; }
    </style>
</head>
<body>

<div id="app">
    <!-- 상단 바 -->
    <div id="top-bar">
        <div class="stat-badge" id="top-item-timer" style="color:#e67e22; flex-shrink: 0; font-size:12px; border-color:#f39c12; width:75px;">📦 00:10</div>
        <div class="top-stats">
            <div class="stat-badge merge">🔄 <span id="val-merge">0</span></div>
            <div class="stat-badge gold">🪙 <span id="val-gold">1,000</span></div>
        </div>
    </div>

    <!-- 메인 콘텐츠 영역 -->
    <div id="main-content">
        
        <!-- 💡 뷰 1: 전투 화면 -->
        <div id="view-battle" class="view-container active">
            <div id="board-section">
                <div id="battle-stage">
                    <img id="hero" class="hero" src="images/character/battle/01_Idle.png" onerror="this.style.display='none'">
                    <div id="enemy" class="character enemy">🦇</div>
                </div>
            </div>
            <div id="game-section">
                <!-- 💡 터치 인식 최적화 박스 -->
                <div id="merge-box">
                    <div id="physics-bg"></div>
                    <div id="physics-guide"></div>
                    <div id="physics-area">
                        <div id="deadline-line"></div>
                        <div id="warning-banner">⚠️ 위험! 5.0초</div>
                        <div id="drop-line"></div>
                        <div id="preview-ball"></div>
                    </div>
                </div>
            </div>
            <div id="ui-section">                
                <div class="item-group">
                    <button class="btn-item btn-mult" id="btn-mult" onclick="toggleMultiplier()">
                        <span class="icon-main" id="mult-label">x1</span><div style="font-size:10px" id="mult-cost">비용: 무료</div>
                    </button>
                    <button class="btn-item btn-hammer" onclick="useItem('hammer')">
                        <span class="icon-main">🔨</span>망치
                        <div class="cost-label">🪙 50</div>
                    </button>
                    <button class="btn-item btn-auto" id="btn-auto" onclick="toggleAutoDrop()">
                        <span class="icon-main" style="font-size: 24px; margin-top:-2px;">🤖</span><div id="auto-label">오토: OFF</div>
                    </button>
                    <button class="btn-item btn-shake" onclick="useItem('shake')">
                        <span class="icon-main">🌪️</span>쉐이크
                        <div class="cost-label">🪙 100</div>
                    </button>
                    <button class="btn-item btn-tornado" id="btn-tornado" onclick="useItem('tornado')">
                        <span class="icon-main">🌀</span>토네이도
                        <div class="cost-label">🪙 300</div>
                    </button>
                </div>
            </div>
        </div>

        <!-- 💡 뷰 2: 캐릭터 뷰 (메뉴 토글 버튼 추가) -->
        <div id="view-character" class="view-container">
            <div class="char-custom-layout">
                
                <div id="char-preview-zone">
                    <img id="char-preview-bg" src="images/bg/lobby/01.png" onerror="this.style.display='none'">
                    <img id="char-preview-body" src="images/character/lobby/body/01.png" onerror="this.style.display='none'">
                    <button id="char-toggle-btn" onclick="toggleCharItemZone()">▶</button>
                </div>

                <div id="char-item-zone">
                    <div id="char-item-title">배경</div>
                    <div id="char-item-list"></div>
                </div>

                <div id="char-cat-zone"></div>
            </div>
        </div>

        <!-- 💡 뷰 3: 구슬 스킨 뷰 -->
        <div id="view-skin" class="view-container">
            <div id="skin-bg-container">
                <img id="skin-display-img" src="">
            </div>
            <div class="view-content">
                <div class="panel">
                    <div class="panel-title">
                        <span>구슬 스킨 설정</span>
                        <span style="font-size:11px; color:#999; font-weight:normal;">스킨 선택 후 구슬 탭하여 장착</span>
                    </div>
                    <div class="skin-equip-grid" id="skin-equip-grid"></div>
                </div>

                <div class="panel">
                    <div class="panel-title">스킨 뽑기</div>
                    <button class="action-btn-main" id="btn-buy-skin" onclick="buySkin()" style="background:#b9f6ca; color:#1b5e20; border-color:#69f0ae;"></button>
                    <div class="inventory-grid" id="skin-inventory-grid"></div>
                </div>
            </div>
        </div>

        <!-- 💡 뷰 4: 아이템 인벤토리 & 합성 -->
        <div id="view-item" class="view-container">
            <div class="view-title">아이템 인벤토리</div>
            <div class="view-content">
                <div class="panel">
                    <div class="panel-title">
                        <span>보급 상자</span>
                        <span style="font-size:14px; color:#e67e22;" id="item-timer-label">⏳ 00:10</span>
                    </div>
                    <button class="action-btn-main" id="btn-claim-item" onclick="claimItem()"></button>
                </div>
                
                <div class="panel" style="background:#f1f8ff;">
                    <div class="panel-title" style="font-size:15px; color:#3498db;">
                        <span>🛠️ 아이템 합성</span>
                        <span style="font-size:11px; color:#999; font-weight:normal;">같은 등급 10개로 상위 합성</span>
                    </div>
                    
                    <div class="craft-slots-container" id="craft-slots"></div>

                    <div style="display:flex; gap:10px;">
                        <button class="action-btn-sub" onclick="autoFillCraft()">⚡ 자동 채우기</button>
                        <button class="action-btn-sub" onclick="clearCraft()">🗑️ 비우기</button>
                        <button class="action-btn-main" style="background:#3498db; color:#fff; border-color:#2980b9; box-shadow:0 4px 0 #2980b9; margin-bottom:0; flex:1.5;" onclick="confirmCraft()">
                            합성 확인
                        </button>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-title">보유 아이템 (52종) <span style="font-size:11px; font-weight:normal; color:#999;">클릭시 합성칸 이동</span></div>
                    <div class="inventory-grid" id="item-inventory-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 하단 네비게이션 -->
    <div id="bottom-nav">
        <div class="nav-item active" id="nav-battle" onclick="switchMenu('battle')"><div class="icon">⚔️</div><div>전투</div></div>
        <div class="nav-item" id="nav-character" onclick="switchMenu('character')"><div class="icon">🐾</div><div>캐릭터</div></div>
        <div class="nav-item" id="nav-skin" onclick="switchMenu('skin')"><div class="icon">🔮</div><div>구슬스킨</div></div>
        <div class="nav-item" id="nav-item" onclick="switchMenu('item')"><div class="icon">🛋️</div><div>아이템</div></div>
    </div>
    
    <!-- 오버레이 -->
    <div id="event-overlay" style="display: none;"></div>
    <div id="event-result" style="display: none;"></div>
    
    <div id="overlay-gameover" class="overlay">
        <div style="font-size: 50px; margin-bottom: 15px;">💥</div>
        <div style="font-size: 28px; font-weight: bold; margin-bottom: 10px; color:#ff7675;">게임 오버!</div>
        <div style="font-size: 16px; margin-bottom: 30px; text-align:center; line-height:1.4;">
            과일판이 꽉 차서 싹쓸이 되었습니다.<br>
            <b style="color:#f6e58d;"><span id="go-timer">3</span>초 후 자동 시작됩니다.</b>
        </div>
        <button class="action-btn" onclick="instantRestart()">🔄 즉시 재시작</button>
    </div>
</div>

<script>
    // ================= [ 글로벌 상태 선언 ] =================
    let globalPause = false;
    let isBattling = false;
    let mergeCount = 0; 
    let gold = 1000;

    function setGlobalPause(isPause) {
        globalPause = isPause;
        if (window.gameRunner) window.gameRunner.enabled = !isPause; 
    }

    const uiMerge = document.getElementById('val-merge');
    const uiGold = document.getElementById('val-gold');

    function updateTopUI() {
        uiMerge.innerText = mergeCount.toLocaleString();
        uiGold.innerText = gold.toLocaleString();
    }
    updateTopUI();

    // ================= [ 캐릭터 꾸미기 시스템 (뷰 2) ] =================
    const CHAR_CATEGORIES = [
        { id: 'bg', name: '배경', type: 'ready', max: 5, path: 'images/bg/lobby/' },
        { id: 'body', name: '바디', type: 'ready', max: 4, path: 'images/character/lobby/body/' },
        { id: 'hair', name: '헤어', type: 'prep' },
        { id: 'eyes', name: '눈', type: 'prep' },
        { id: 'nose', name: '코', type: 'prep' },
        { id: 'mouth', name: '입', type: 'prep' },
        { id: 'top', name: '상의', type: 'prep' },
        { id: 'bottom', name: '하의', type: 'prep' },
        { id: 'hat', name: '모자', type: 'prep' },
        { id: 'wrist', name: '손목', type: 'prep' },
        { id: 'shoes', name: '신발', type: 'prep' },
        { id: 'acc', name: '악세사리', type: 'prep' }
    ];

    let charConfig = { bg: 1, body: 1 };
    let activeCharCategory = 'bg';
    let isItemZoneHidden = false; 

    function initCharCustomUI() {
        const catZone = document.getElementById('char-cat-zone');
        catZone.innerHTML = '';
        CHAR_CATEGORIES.forEach(cat => {
            const div = document.createElement('div');
            div.className = `cat-tab ${cat.id === activeCharCategory ? 'active' : ''}`;
            div.innerText = cat.name;
            
            div.onclick = () => {
                if(activeCharCategory === cat.id && !isItemZoneHidden) {
                    toggleCharItemZone(true);
                } else {
                    if (isItemZoneHidden) toggleCharItemZone(false);
                    selectCharCategory(cat.id);
                }
            };
            catZone.appendChild(div);
        });
        renderCharItems();
    }

    window.toggleCharItemZone = function(forceHide) {
        const itemZone = document.getElementById('char-item-zone');
        const btn = document.getElementById('char-toggle-btn');
        
        if (typeof forceHide !== 'undefined') {
            isItemZoneHidden = forceHide;
        } else {
            isItemZoneHidden = !isItemZoneHidden;
        }

        if (isItemZoneHidden) {
            itemZone.style.display = 'none';
            btn.innerText = '◀';
        } else {
            itemZone.style.display = 'flex';
            btn.innerText = '▶';
        }
    }

    function selectCharCategory(catId) {
        activeCharCategory = catId;
        const catData = CHAR_CATEGORIES.find(c => c.id === catId);
        
        document.querySelectorAll('.cat-tab').forEach(el => {
            el.classList.remove('active');
            if (el.innerText === catData.name) el.classList.add('active');
        });
        
        document.getElementById('char-item-title').innerText = catData.name;
        renderCharItems();
    }

    function renderCharItems() {
        const list = document.getElementById('char-item-list');
        list.innerHTML = '';
        const catData = CHAR_CATEGORIES.find(c => c.id === activeCharCategory);

        if (catData.type === 'prep') {
            list.innerHTML = `<div style="grid-column: span 2; text-align: center; color: #b2bec3; font-size: 13px; margin-top: 30px; font-weight: bold;">준비중입니다</div>`;
            return;
        }

        for (let i = 1; i <= catData.max; i++) {
            const div = document.createElement('div');
            const isSelected = charConfig[activeCharCategory] === i;
            const containClass = activeCharCategory === 'body' ? 'contain-mode' : '';
            div.className = `char-item-btn ${isSelected ? 'selected' : ''} ${containClass}`;
            
            const numStr = i.toString().padStart(2, '0');
            const imgSrc = `${catData.path}${numStr}.png`;
            
            div.innerHTML = `<img src="${imgSrc}" onerror="this.style.display='none'; this.parentNode.innerText='${numStr}'">`;
            div.onclick = () => equipCustomItem(activeCharCategory, i);
            list.appendChild(div);
        }
    }

    function equipCustomItem(catId, itemId) {
        charConfig[catId] = itemId;
        const numStr = itemId.toString().padStart(2, '0');
        
        if (catId === 'bg') {
            document.getElementById('char-preview-bg').src = `images/bg/lobby/${numStr}.png`;
        } else if (catId === 'body') {
            document.getElementById('char-preview-body').src = `images/character/lobby/body/${numStr}.png`;
        }
        renderCharItems(); 
    }

    // ================= [ 배수 & 구슬 스킨 시스템 (뷰 3) ] =================
    const multList = [ { val: 1, cost: 0 }, { val: 2, cost: 20 }, { val: 5, cost: 50 }, { val: 10, cost: 100 } ];
    let multIndex = 0;
    let multiplier = 1;

    let skinCostMerge = 1; 
    let skinCostGold = 10;
    
    const SKIN_LIST = [
        'images/bead/animal_lv01.png', 'images/bead/animal_lv02.png', 'images/bead/animal_lv03.png',
        'images/bead/animal_lv04.png', 'images/bead/animal_lv05.png', 'images/bead/animal_lv06.png',
        'images/bead/animal_lv07.png', 'images/bead/animal_lv08.png', 'images/bead/animal_lv09.png',
        'images/bead/animal_lv10.png', 'images/bead/animal_lv11.png', 'images/bead/animal_lv12.png',
        'images/bead/dot_lv01.png', 'images/bead/dot_lv02.png', 'images/bead/dot_lv03.png',
        'images/bead/dot_lv04.png', 'images/bead/dot_lv05.png', 'images/bead/dot_lv06.png',
        'images/bead/dot_lv07.png', 'images/bead/dot_lv08.png', 'images/bead/dot_lv09.png',
        'images/bead/dot_lv10.png'
    ];

    let skinInventory = new Array(22).fill(0);
    skinInventory[0] = 1; 
    
    let equippedSkins = new Array(12).fill(null);
    let selectedSkinIndex = -1;

    window.getBodyRenderOptions = function(level) {
        const skinSrc = equippedSkins[level];
        if (skinSrc) {
            const scale = (LEVELS[level].radius * 2) / 256;
            return { 
                fillStyle: 'transparent', 
                sprite: { texture: skinSrc, xScale: scale, yScale: scale } 
            };
        }
        return { fillStyle: LEVELS[level].color };
    };

    // ================= [ 아이템 시스템 (뷰 4) ] =================
    const ITEMS_DB = {
        SS: ['🌌', '🌠', '🎆', '🎇', '👑'],
        S:  ['🐉', '🦄', '🦅', '🦁', '🐯', '🦈', '🐙', '🦋', '🦖', '🦚'],
        A:  ['🚀', '🛸', '🚁', '🛰️', '🎠', '🏎️', '🏍️', '🛳️', '🚄', '🚜'],
        B:  ['💎', '💍', '🎩', '🔮', '🧿', '🏺', '🎭', '🎨', '🎲', '🧩', '🎸', '🎷'],
        C:  ['🪴', '🧸', '📚', '☕', '📺', '🕹️', '🐈', '🖼️', '🕰️', '🛋️', '🛏️', '🌵', '📻', '🛹', '🪀']
    };
    const TIER_ORDER = ['C', 'B', 'A', 'S', 'SS'];
    const ITEMS_TIER_MAP = {};
    let itemInventory = {};
    Object.keys(ITEMS_DB).forEach(tier => { 
        ITEMS_DB[tier].forEach(item => { 
            itemInventory[item] = { tier: tier, count: 0 }; 
            ITEMS_TIER_MAP[item] = tier;
        }); 
    });
    
    let itemCostMerge = 1;
    let itemTimer = 10;
    let isItemReady = false; 
    let craftSlots = [];

    // ================= [ 타이머 루프 ] =================
    let autoDropTick = 0;

    setInterval(() => {
        if (globalPause) return; 

        if (itemTimer > 0) { itemTimer--; isItemReady = false; }
        const topTimerEl = document.getElementById('top-item-timer');
        if (itemTimer <= 0 && mergeCount >= itemCostMerge) {
            if (!isItemReady) {
                isItemReady = true; showFloatingText("📦 보급 상자 획득 가능!", 210, 100, "#1dd1a1");
            }
            topTimerEl.innerHTML = '<span style="color:#27ae60;">📦 완료!</span>'; topTimerEl.style.borderColor = '#27ae60';
        } else {
            let mins = Math.floor(itemTimer / 60).toString().padStart(2, '0'); let secs = (itemTimer % 60).toString().padStart(2, '0');
            topTimerEl.innerHTML = `📦 ${mins}:${secs}`; topTimerEl.style.borderColor = '#f39c12';
        }
        if (currentMenu === 'item') updateItemUI();
    }, 1000);

    setInterval(() => {
        if (globalPause) return;
        if (isAutoDrop && currentMenu === 'battle' && !isGameOver) {
            autoDropTick++;
            if (autoDropTick >= 6) { 
                autoDropTick = 0; 
                if (canDrop) {
                    const canvasWidth = document.getElementById('physics-area').clientWidth || 390;
                    window.executeDrop(Math.random() * (canvasWidth - 40) + 20); 
                }
            }
        }
    }, 100);

    // ================= [ 구슬 스킨 UI 및 장착 로직 ] =================
    function updateSkinUI() {
        const btn = document.getElementById('btn-buy-skin');
        if (mergeCount >= skinCostMerge && gold >= skinCostGold) {
            btn.disabled = false; btn.innerHTML = `🎁 스킨 뽑기<br><span style="font-size:13px; color:#1b5e20;">요구: ${skinCostMerge.toLocaleString()} 🔄 + ${skinCostGold.toLocaleString()} 🪙</span>`;
        } else {
            btn.disabled = true; btn.innerHTML = `🎁 스킨 뽑기<br><span style="font-size:13px; color:#999;">요구: ${skinCostMerge.toLocaleString()} 🔄 + ${skinCostGold.toLocaleString()} 🪙</span>`;
        }
        
        const grid = document.getElementById('skin-inventory-grid'); grid.innerHTML = '';
        for (let i = 0; i < SKIN_LIST.length; i++) {
            const count = skinInventory[i]; 
            const div = document.createElement('div'); 
            div.className = `inv-item ${count === 0 ? 'unowned' : ''} ${selectedSkinIndex === i ? 'selected' : ''}`;
            if (count > 0) div.onclick = () => selectSkinForEquip(i);
            
            div.innerHTML = `<img src="${SKIN_LIST[i]}" class="skin-img-icon" onerror="this.src='https://via.placeholder.com/40'">${count > 0 ? `<div class="count">${count}</div>` : ''}`;
            grid.appendChild(div);
        }

        const skinGrid = document.getElementById('skin-equip-grid'); skinGrid.innerHTML = '';
        for(let i = 0; i < 12; i++) {
            const slot = document.createElement('div');
            slot.className = 'skin-slot';
            slot.style.background = LEVELS[i].color;
            slot.onclick = () => equipSkin(i);
            
            const imgHtml = equippedSkins[i] ? `<img src="${equippedSkins[i]}" style="width:80%; height:80%; object-fit:contain; pointer-events:none;">` : '';
            slot.innerHTML = `${imgHtml}<div class="level-badge">Lv.${i+1}</div>`;
            skinGrid.appendChild(slot);
        }
    }

    function selectSkinForEquip(index) {
        if (skinInventory[index] > 0) {
            selectedSkinIndex = index;
            const displayImg = document.getElementById('skin-display-img'); 
            displayImg.style.opacity = 0;
            setTimeout(() => { 
                displayImg.src = SKIN_LIST[index]; 
                displayImg.style.display = 'block';
                displayImg.style.opacity = 1; 
            }, 150);
            updateSkinUI(); 
        }
    }

    function equipSkin(levelIndex) {
        if(selectedSkinIndex === -1) {
            showFloatingText("인벤토리에서 장착할 스킨을 먼저 선택하세요!", 210, 400, "#ff7675");
            return;
        }
        equippedSkins[levelIndex] = SKIN_LIST[selectedSkinIndex];
        updateSkinUI();
        showFloatingText(`Lv.${levelIndex+1} 구슬 스킨 장착 완료!`, 210, 300, "#1dd1a1");
        
        if(typeof updatePreview === 'function') updatePreview(); 

        if (window.world && window.Matter) {
            const bodies = window.Matter.Composite.allBodies(window.world).filter(b => b.level === levelIndex);
            bodies.forEach(body => {
                const renderOpt = window.getBodyRenderOptions(body.level);
                body.render.fillStyle = renderOpt.fillStyle;
                if (renderOpt.sprite) {
                    body.render.sprite = renderOpt.sprite;
                } else {
                    delete body.render.sprite; 
                }
            });
        }
    }

    window.buySkin = function() {
        if (mergeCount < skinCostMerge || gold < skinCostGold) return;
        
        mergeCount -= skinCostMerge;
        gold -= skinCostGold;
        
        const picked = Math.floor(Math.random() * SKIN_LIST.length); 
        skinInventory[picked]++;
        
        updateTopUI(); 
        selectSkinForEquip(picked); 
        updateSkinUI(); 
        
        setGlobalPause(true);
        const resultEl = document.getElementById('event-result');
        resultEl.innerHTML = `<img src="${SKIN_LIST[picked]}" style="width:120px; height:120px; animation: popZoom 0.5s forwards; filter: drop-shadow(0 0 10px rgba(255,255,255,0.8));"><div style="font-size:24px; color:#1dd1a1; font-weight:bold; margin-top:10px;">신규 스킨 획득!</div>`;
        document.getElementById('event-overlay').style.display = 'block'; resultEl.style.display = 'flex'; resultEl.className = 'pop-zoom';
        setTimeout(() => { document.getElementById('event-overlay').style.display = 'none'; resultEl.style.display = 'none'; setGlobalPause(false); }, 1500);
    }


    // ================= [ 아이템 및 10칸 합성 로직 ] =================
    function updateCraftUI() {
        const container = document.getElementById('craft-slots');
        container.innerHTML = '';
        for(let i=0; i<10; i++) {
            const slot = document.createElement('div');
            slot.className = `craft-slot ${craftSlots[i] ? 'filled' : ''}`;
            if(craftSlots[i]) {
                slot.innerText = craftSlots[i];
                slot.onclick = () => removeFromCraft(i); 
            }
            container.appendChild(slot);
        }
    }

    function addToCraft(item) {
        if(craftSlots.length >= 10) { showFloatingText("합성 칸이 꽉 찼습니다!", 210, 300, "#ff7675"); return; }
        if(craftSlots.length > 0) {
            const currentTier = ITEMS_TIER_MAP[craftSlots[0]];
            if(ITEMS_TIER_MAP[item] !== currentTier) { showFloatingText("같은 등급의 아이템만 올릴 수 있습니다!", 210, 300, "#ff7675"); return; }
        }
        itemInventory[item].count--; craftSlots.push(item); updateItemUI();
    }

    function removeFromCraft(index) {
        const item = craftSlots[index]; craftSlots.splice(index, 1); itemInventory[item].count++; updateItemUI();
    }

    window.clearCraft = function() {
        while(craftSlots.length > 0) { const item = craftSlots.pop(); itemInventory[item].count++; } updateItemUI();
    }

    window.autoFillCraft = function() {
        let targetTier = craftSlots.length > 0 ? ITEMS_TIER_MAP[craftSlots[0]] : null;
        if(!targetTier) {
            for(let tier of TIER_ORDER) {
                if(tier === 'SS') continue; 
                let totalInTier = 0; ITEMS_DB[tier].forEach(item => totalInTier += itemInventory[item].count);
                if(totalInTier >= 10) { targetTier = tier; break; }
            }
        }
        if(!targetTier) { showFloatingText("합성 가능한 등급(10개 이상)이 없습니다.", 210, 300, "#ff7675"); return; }
        let needed = 10 - craftSlots.length;
        for(let item of ITEMS_DB[targetTier]) {
            while(itemInventory[item].count > 0 && needed > 0) { itemInventory[item].count--; craftSlots.push(item); needed--; }
            if(needed <= 0) break;
        }
        updateItemUI();
    }

    window.confirmCraft = function() {
        if(craftSlots.length < 10) { showFloatingText("합성 칸을 10개 모두 채워주세요!", 210, 300, "#ff7675"); return; }
        const currentTier = ITEMS_TIER_MAP[craftSlots[0]];
        const tierIndex = TIER_ORDER.indexOf(currentTier);
        if(tierIndex === -1 || currentTier === 'SS') { showFloatingText("이 등급은 합성할 수 없습니다.", 210, 300, "#ff7675"); return; }
        const nextTier = TIER_ORDER[tierIndex + 1];
        const nextPool = ITEMS_DB[nextTier]; const pickedItem = nextPool[Math.floor(Math.random() * nextPool.length)];
        
        craftSlots = []; itemInventory[pickedItem].count++; updateItemUI();
        setGlobalPause(true);
        const resultEl = document.getElementById('event-result');
        resultEl.innerHTML = `<div style="font-size:80px; animation: popZoom 0.5s forwards;">${pickedItem}</div><div style="font-size:24px; color:#3498db; font-weight:bold; margin-top:10px;">합성 성공! ${nextTier} 랭크 획득!</div>`;
        document.getElementById('event-overlay').style.display = 'block'; resultEl.style.display = 'flex'; resultEl.className = 'pop-zoom';
        setTimeout(() => { document.getElementById('event-overlay').style.display = 'none'; resultEl.style.display = 'none'; setGlobalPause(false); }, 2000);
    }

    function updateItemUI() {
        const btn = document.getElementById('btn-claim-item'); const timerLabel = document.getElementById('item-timer-label');
        if (itemTimer <= 0 && mergeCount >= itemCostMerge) {
            btn.disabled = false; btn.innerHTML = `📦 아이템 획득!<br><span style="font-size:13px; color:#27ae60;">클릭하여 열기 (요구: ${itemCostMerge.toLocaleString()} 🔄)</span>`; timerLabel.innerText = '✅ 준비 완료';
        } else {
            btn.disabled = true; let timeStr = "";
            if (itemTimer > 0) {
                let mins = Math.floor(itemTimer / 60).toString().padStart(2, '0'); let secs = (itemTimer % 60).toString().padStart(2, '0');
                timerLabel.innerText = `⏳ ${mins}:${secs}`; timeStr = `(⏳ ${mins}:${secs})`;
            } else timerLabel.innerText = `⏳ 시간 완료 (머지 부족)`;
            btn.innerHTML = `📦 아이템 대기중<br><span style="font-size:13px; color:#999;">요구: ${itemCostMerge.toLocaleString()} 🔄 ${timeStr}</span>`;
        }
        updateCraftUI(); 
        const grid = document.getElementById('item-inventory-grid'); grid.innerHTML = '';
        TIER_ORDER.forEach(tier => {
            ITEMS_DB[tier].forEach(item => {
                const data = itemInventory[item]; 
                const div = document.createElement('div'); div.className = `inv-item ${data.count === 0 ? 'unowned' : ''}`;
                if(data.count > 0) { div.onclick = () => addToCraft(item); }
                div.innerHTML = `<div class="tier-label tier-${tier}">${tier}</div><div class="emoji">${item}</div>${data.count > 0 ? `<div class="count">${data.count}</div>` : ''}`;
                grid.appendChild(div);
            });
        });
    }

    window.claimItem = function() {
        if (itemTimer > 0 || mergeCount < itemCostMerge) return;
        mergeCount -= itemCostMerge; itemTimer = 10; isItemReady = false;
        
        const pool = ITEMS_DB['C']; 
        for(let i=0; i<10; i++) {
            const pickedItem = pool[Math.floor(Math.random() * pool.length)]; 
            itemInventory[pickedItem].count++;
        }
        
        updateTopUI(); updateItemUI();
        setGlobalPause(true);
        const resultEl = document.getElementById('event-result');
        resultEl.innerHTML = `<div style="font-size:80px; animation: popZoom 0.5s forwards;">🎁</div><div style="font-size:24px; color:#f6e58d; font-weight:bold; margin-top:10px;">C 랭크 아이템 10개 획득! (테스트)</div>`;
        document.getElementById('event-overlay').style.display = 'block'; resultEl.style.display = 'flex'; resultEl.className = 'pop-zoom';
        setTimeout(() => { document.getElementById('event-overlay').style.display = 'none'; resultEl.style.display = 'none'; setGlobalPause(false); }, 1500);
    }

    // 네비게이션
    let currentMenu = 'battle';
    window.switchMenu = function(menuId) {
        currentMenu = menuId;
        document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active')); 
        document.getElementById('view-' + menuId).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active')); 
        document.getElementById('nav-' + menuId).classList.add('active');
        if (menuId === 'skin') updateSkinUI(); 
        if (menuId === 'item') updateItemUI();
        if (menuId === 'character' && document.getElementById('char-cat-zone').innerHTML === '') {
            initCharCustomUI();
        }
    }

    // ================= [ 시각 효과 및 이벤트 처리 ] =================
    window.toggleMultiplier = function() {
        const nextIndex = (multIndex + 1) % multList.length;
        const nextData = multList[nextIndex];
        if (gold < nextData.cost) { showFloatingText(`골드가 부족합니다! (필요: ${nextData.cost}🪙)`, 210, 400, "#ff7675"); return; }
        gold -= nextData.cost; multIndex = nextIndex; multiplier = nextData.val; updateTopUI();
        
        document.getElementById('mult-label').innerText = 'x' + multiplier;
        const nextCost = multList[(multIndex + 1) % multList.length].cost;
        document.getElementById('mult-cost').innerText = nextCost > 0 ? `비용: ${nextCost}🪙` : '비용: 무료';
        
        const btn = document.getElementById('btn-mult'); btn.style.transform = 'translateY(4px)'; setTimeout(() => btn.style.transform = 'translateY(0)', 100);
    }

    // 💡 합쳐질 때 나는 이펙트 위치를 캔버스 기준 완벽 일치하도록 변경
    function createMergeEffect(x, y, level) {
        const physicsArea = document.getElementById('physics-area');
        const effectContainer = document.createElement('div');
        effectContainer.style.position = 'absolute'; 
        // x, y 좌표는 중앙 기준
        effectContainer.style.left = x + 'px'; 
        effectContainer.style.top = y + 'px'; 
        effectContainer.style.pointerEvents = 'none'; 
        effectContainer.style.zIndex = '15';
        
        const size = 30 + (level * 10);
        const flash = document.createElement('div'); 
        flash.style.position = 'absolute'; flash.style.width = size + 'px'; flash.style.height = size + 'px'; 
        flash.style.background = 'radial-gradient(circle, rgba(255,255,255,1) 20%, rgba(255,255,255,0) 80%)'; 
        flash.style.borderRadius = '50%'; flash.style.animation = 'whiteFlash 0.3s ease-out forwards';
        
        const ring = document.createElement('div'); 
        ring.style.position = 'absolute'; ring.style.width = size + 'px'; ring.style.height = size + 'px'; 
        ring.style.borderRadius = '50%'; ring.style.boxShadow = '0 0 10px #fff, inset 0 0 10px #fff'; 
        ring.style.animation = 'ringExpand 0.4s ease-out forwards';
        
        effectContainer.appendChild(flash); effectContainer.appendChild(ring);
        physicsArea.appendChild(effectContainer);
        setTimeout(() => effectContainer.remove(), 400);
        
        if (level >= 4) { document.getElementById('app').classList.add('merge-shake'); setTimeout(() => document.getElementById('app').classList.remove('merge-shake'), 150); }
    }

    function showFloatingText(text, x, y, color = '#fff') {
        const app = document.getElementById('app');
        const el = document.createElement('div'); el.className = 'floating-text'; el.innerHTML = text;
        el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.color = color;
        app.appendChild(el); setTimeout(() => el.remove(), 1000);
    }

    const heroEl = document.getElementById('hero'); const enemyEl = document.getElementById('enemy');

    function triggerBattle() {
        if (isBattling || globalPause) return; 
        isBattling = true;
        const enemies = ['🦇', '🦹‍♂️', '👾', '🧛', '🧟', '🐉', '🐲'];
        enemyEl.innerText = enemies[Math.floor(Math.random() * enemies.length)]; enemyEl.className = 'character enemy slide-in';

        setTimeout(() => {
            heroEl.classList.add('attack');
            setTimeout(() => {
                heroEl.classList.remove('attack'); enemyEl.className = 'character enemy explode';
                
                const hitEffect = document.createElement('div');
                hitEffect.className = 'hit-effect-sprite';
                hitEffect.innerText = '💥';
                document.getElementById('battle-stage').appendChild(hitEffect);
                setTimeout(() => hitEffect.remove(), 300);

                const rand = Math.floor(Math.random() * 12); 
                let rewardText = null; let rewardColor = "#fff";
                
                if (rand < 4) { const amount = 100 * multiplier; gold += amount; rewardText = `+${amount} 🪙`; rewardColor = "#f6e58d";
                } else if (rand < 6) { const amount = 200 * multiplier; gold += amount; rewardText = `+${amount} 🪙`; rewardColor = "#f6e58d";
                } else if (rand < 8) { const amount = 300 * multiplier; gold += amount; rewardText = `+${amount} 🪙`; rewardColor = "#f6e58d";
                } else if (rand < 9) { const amount = 500 * multiplier; gold += amount; rewardText = `+${amount} 🪙`; rewardColor = "#f6e58d";
                } else if (rand < 10) { const amount = 30 * multiplier; gold = Math.max(0, gold - amount); rewardText = `-${amount} 🪙`; rewardColor = "#ff7675";
                } else if (rand < 11) { const amount = 50 * multiplier; gold = Math.max(0, gold - amount); rewardText = `-${amount} 🪙`; rewardColor = "#ff7675";
                } else { rewardText = `단순 공격 ⚔️`; rewardColor = "#fff"; }
                
                updateTopUI();
                if (rewardText !== null) showFloatingText(rewardText, 250, 100, rewardColor);
                setTimeout(() => { enemyEl.className = 'character enemy'; if (rewardText !== null) isBattling = false; }, 400);
            }, 300); 
        }, 200); 
    }

    // ================= [ Matter.js 물리 엔진 ] =================
    let LEVELS = [
        { radius: 15, color: '#ffb8b8' }, { radius: 22, color: '#ff9c9c' }, { radius: 30, color: '#ff7f7f' },
        { radius: 40, color: '#ff6666' }, { radius: 50, color: '#ff4d4d' }, { radius: 62, color: '#ff3333' },
        { radius: 75, color: '#e60000' }, { radius: 90, color: '#cc0000' }, { radius: 108, color: '#b30000' },
        { radius: 125, color: '#990000' }, { radius: 145, color: '#800000' }, { radius: 165, color: '#660000' }
    ];

    let isAutoDrop = false; let canDrop = true; let isGameOver = false; let isWarning = false; 
    let tornadoTicks = 0; let invincibleEndTime = 0; 
    let mergeQueue = []; 

    window.onload = () => {
        updateSkinUI();
        initCharCustomUI();
        
        const Engine = Matter.Engine, Render = Matter.Render, Runner = Matter.Runner, Bodies = Matter.Bodies, Composite = Matter.Composite, Events = Matter.Events;
        const physicsArea = document.getElementById('physics-area');
        
        // 💡 캔버스 크기를 DOM 크기와 동적으로 1:1 완벽 매칭시켜 오차 발생 원천 차단
        const canvasWidth = physicsArea.clientWidth || 390;
        const canvasHeight = physicsArea.clientHeight || 413;
        
        window.world = Engine.create({ enableSleeping: false }).world;
        const engine = window.world.parent || Engine.create({ enableSleeping: false }); 
        window.world = engine.world; window.gameRunner = Runner.create();
        
        const render = Render.create({
            element: physicsArea, engine: engine,
            options: { 
                width: canvasWidth, 
                height: canvasHeight, 
                wireframes: false, 
                background: 'transparent',
                pixelRatio: window.devicePixelRatio || 1 // 💡 고화질 렌더링 지원
            }
        });

        Render.run(render); Runner.run(window.gameRunner, engine);

        const wallOptions = { isStatic: true, render: { fillStyle: 'transparent' } };
        const floor = Bodies.rectangle(canvasWidth / 2, canvasHeight + 50, canvasWidth * 5, 100, wallOptions);
        const leftWall = Bodies.rectangle(-50, canvasHeight / 2, 100, canvasHeight * 5, wallOptions);
        const rightWall = Bodies.rectangle(canvasWidth + 50, canvasHeight / 2, 100, canvasHeight * 5, wallOptions);
        Composite.add(window.world, [floor, leftWall, rightWall]);

        Events.on(engine, 'collisionStart', (event) => {
            const pairs = event.pairs;
            for (let i = 0; i < pairs.length; i++) {
                const bodyA = pairs[i].bodyA; const bodyB = pairs[i].bodyB;
                if (bodyA.level !== undefined && bodyB.level !== undefined && bodyA.level === bodyB.level && !bodyA.isMerging && !bodyB.isMerging && bodyA.level < LEVELS.length - 1) {
                    bodyA.isMerging = true; bodyB.isMerging = true;
                    mergeQueue.push({ bodyA, bodyB, level: bodyA.level + 1 });
                }
            }
        });

        Events.on(engine, 'beforeUpdate', () => {
            if (globalPause) return;

            if (tornadoTicks > 0) {
                tornadoTicks--;
                const allBalls = Composite.allBodies(window.world).filter(b => b.level !== undefined);
                const cx = canvasWidth / 2;
                allBalls.forEach(b => { Matter.Body.applyForce(b, b.position, { x: (cx - b.position.x) * 0.00003 + (Math.random() - 0.5) * 0.0005 * b.mass, y: -0.002 * b.mass }); });
            }
            
            if (mergeQueue.length > 0) {
                mergeQueue.forEach(merge => {
                    const midX = (merge.bodyA.position.x + merge.bodyB.position.x) / 2; const midY = (merge.bodyA.position.y + merge.bodyB.position.y) / 2;
                    Composite.remove(window.world, [merge.bodyA, merge.bodyB]);

                    const nextLevelData = LEVELS[merge.level];
                    const renderOpt = window.getBodyRenderOptions(merge.level); 
                    
                    const newBody = Bodies.circle(midX, midY, nextLevelData.radius, {
                        restitution: 0.3, friction: 0.1, render: renderOpt
                    });
                    newBody.level = merge.level; newBody.isMerging = false; newBody.spawnTime = Date.now(); 
                    Matter.Body.setVelocity(newBody, { x: 0, y: -2.5 }); 
                    Composite.add(window.world, newBody); 
                    
                    createMergeEffect(midX, midY, merge.level); 
                    mergeCount++; updateTopUI(); if(currentMenu === 'item') updateItemUI(); triggerBattle(); 
                });
                mergeQueue = []; 
            }
            
            const allBodies = Composite.allBodies(window.world);
            allBodies.forEach(b => { if (b.position.y > canvasHeight + 200) Composite.remove(window.world, b); });
        });

        window.useItem = function(itemType) {
            if (isGameOver || globalPause || currentMenu !== 'battle') return; 
            let cost = (itemType === 'tornado') ? 300 : (itemType === 'hammer' ? 50 : 100);
            if (gold < cost) { showFloatingText("골드가 부족합니다!", 210, 400, "#ff7675"); return; }
            gold -= cost; updateTopUI();

            const allBalls = Composite.allBodies(window.world).filter(b => b.level !== undefined);
            if (itemType === 'hammer' && allBalls.length > 0) {
                const target = allBalls[Math.floor(Math.random() * allBalls.length)];
                Composite.remove(window.world, target); 
                showFloatingText(`파괴! 🔨`, target.position.x + 20, target.position.y, '#fff');
            } else if (itemType === 'shake') {
                allBalls.forEach(b => { const force = 0.12 * b.mass; Matter.Body.applyForce(b, b.position, { x: (Math.random() - 0.5) * force, y: -force * 1.8 }); });
                showFloatingText(`쉐이크 🌪️`, 210, 400); 
                invincibleEndTime = Date.now() + 10000; 
            } else if (itemType === 'tornado' && tornadoTicks <= 0) {
                showFloatingText(`토네이도 발동! 🌀`, 210, 400, "#78e08f");
                tornadoTicks = 180; invincibleEndTime = Date.now() + 10000; 
                const btn = document.getElementById('btn-tornado'); btn.classList.add('active'); setTimeout(() => btn.classList.remove('active'), 3000);
            }
        };

        const dropLine = document.getElementById('drop-line'); const previewDiv = document.getElementById('preview-ball');
        let nextDropLevel = Math.floor(Math.random() * 2); let lastMouseX = canvasWidth / 2; 

        window.updatePreview = function() {
            const data = LEVELS[nextDropLevel]; 
            const skinSrc = equippedSkins[nextDropLevel];
            previewDiv.style.width = (data.radius * 2) + 'px'; 
            previewDiv.style.height = (data.radius * 2) + 'px'; 
            
            if (skinSrc) {
                previewDiv.style.backgroundColor = 'transparent';
                previewDiv.style.border = 'none';
                previewDiv.innerHTML = `<img src="${skinSrc}" style="width:100%; height:100%; object-fit:contain; border-radius:50%; opacity:0.8;">`;
            } else {
                previewDiv.innerHTML = '';
                previewDiv.style.backgroundColor = data.color;
                previewDiv.style.border = '2px solid rgba(255,255,255,0.5)';
            }
            
            if (!isAutoDrop && currentMenu === 'battle' && !isGameOver && !globalPause) previewDiv.style.display = 'flex';
            else previewDiv.style.display = 'none';
        }
        updatePreview();

        const mergeBox = document.getElementById('merge-box');
        let isDragging = false;

        mergeBox.addEventListener('pointerdown', (e) => { 
            if (isAutoDrop || currentMenu !== 'battle' || isGameOver || globalPause || !canDrop) return;
            isDragging = true;
            
            const rect = physicsArea.getBoundingClientRect();
            const levelData = LEVELS[nextDropLevel];
            
            let rawX = e.clientX - rect.left;
            // 💡 마우스 누를 때부터 벽 뚫기 방지(Bound) 적용하여 엇나감 원천 차단
            lastMouseX = Math.min(Math.max(rawX, levelData.radius), canvasWidth - levelData.radius);
            
            dropLine.style.display = 'block'; 
            previewDiv.style.left = lastMouseX + 'px';
            dropLine.style.left = lastMouseX + 'px';
            
            mergeBox.setPointerCapture(e.pointerId);
        });

        mergeBox.addEventListener('pointermove', (e) => {
            if(!isDragging) return;
            
            const rect = physicsArea.getBoundingClientRect();
            const levelData = LEVELS[nextDropLevel];
            
            let rawX = e.clientX - rect.left;
            // 💡 마우스 이동 중에도 철저하게 Bound 유지
            lastMouseX = Math.min(Math.max(rawX, levelData.radius), canvasWidth - levelData.radius);
            
            dropLine.style.display = 'block'; 
            previewDiv.style.left = lastMouseX + 'px';
            dropLine.style.left = lastMouseX + 'px';
        });

        mergeBox.addEventListener('pointerup', (e) => { 
            if (!isDragging) return; 
            isDragging = false;
            mergeBox.releasePointerCapture(e.pointerId);
            
            if (isAutoDrop || currentMenu !== 'battle' || isGameOver || globalPause || !canDrop) {
                dropLine.style.display = 'none';
                return;
            }
            window.executeDrop(lastMouseX); 
        });

        mergeBox.addEventListener('pointercancel', (e) => {
            if (!isDragging) return;
            isDragging = false;
            mergeBox.releasePointerCapture(e.pointerId);
            dropLine.style.display = 'none';
        });

        window.executeDrop = function(xPos) {
            const levelData = LEVELS[nextDropLevel]; 
            const startX = Math.min(Math.max(xPos, levelData.radius), canvasWidth - levelData.radius);
            const renderOpt = window.getBodyRenderOptions(nextDropLevel); 
            
            const body = Bodies.circle(startX, 20, levelData.radius, {
                restitution: 0.3, friction: 0.1, render: renderOpt
            });
            body.level = nextDropLevel; body.isMerging = false; body.spawnTime = Date.now();
            Composite.add(window.world, body);

            canDrop = false; previewDiv.style.display = 'none'; dropLine.style.display = 'none';
            setTimeout(() => { canDrop = true; nextDropLevel = Math.floor(Math.random() * 2); updatePreview(); }, 500);
        }

        window.toggleAutoDrop = function() {
            isAutoDrop = !isAutoDrop; const btnAuto = document.getElementById('btn-auto');
            if (isAutoDrop) {
                btnAuto.classList.add('active'); document.getElementById('auto-label').innerText = '오토: ON'; previewDiv.style.display = 'none'; dropLine.style.display = 'none'; showFloatingText(`오토 드롭 ON! 🤖`, 210, 400);
            } else {
                btnAuto.classList.remove('active'); document.getElementById('auto-label').innerText = '오토: OFF'; updatePreview();
            }
        }

        let warningTimeRemaining = 5.0;
        const DEADLINE_Y = 35; const warningBanner = document.getElementById('warning-banner');
        let restartCountdown = null;

        setInterval(() => {
            if (isGameOver || globalPause) {
                if (isWarning) { isWarning = false; warningBanner.style.display = 'none'; }
                return;
            }
            
            if (Date.now() < invincibleEndTime) {
                if(isWarning) { isWarning = false; warningBanner.style.display = 'none'; warningTimeRemaining = 5.0; }
                return;
            }

            const bodies = Composite.allBodies(window.world).filter(b => b.level !== undefined && !b.isStatic);
            let isOverflow = false; const now = Date.now();
            
            for (let b of bodies) {
                if (now - b.spawnTime > 1500 && b.position.y - LEVELS[b.level].radius <= DEADLINE_Y && Math.abs(b.velocity.y) < 0.1 && Math.abs(b.velocity.x) < 0.1 && b.speed < 0.2) { 
                    isOverflow = true; break; 
                }
            }

            if (isOverflow && !isWarning) {
                isWarning = true; warningTimeRemaining = 5.0; warningBanner.style.display = 'block';
            } else if (isOverflow && isWarning) {
                warningTimeRemaining -= 0.1; warningBanner.innerText = `⚠️ 위험! ${Math.max(0, warningTimeRemaining).toFixed(1)}초`;
                
                if (warningTimeRemaining <= 0) {
                    isGameOver = true; isWarning = false; warningBanner.style.display = 'none';
                    setGlobalPause(true); 
                    
                    document.getElementById('overlay-gameover').style.display = 'flex';
                    let timeLeft = 3; document.getElementById('go-timer').innerText = timeLeft;
                    
                    restartCountdown = setInterval(() => {
                        timeLeft--;
                        if(timeLeft > 0) { document.getElementById('go-timer').innerText = timeLeft; } 
                        else { clearInterval(restartCountdown); window.restartGame(); }
                    }, 1000);
                }
            } else if (!isOverflow && isWarning) { 
                isWarning = false; warningBanner.style.display = 'none'; 
            }
        }, 100);

        window.instantRestart = function() {
            if(restartCountdown) clearInterval(restartCountdown);
            window.restartGame();
        }

        window.restartGame = function() {
            document.getElementById('overlay-gameover').style.display = 'none';
            const bodies = Composite.allBodies(window.world).filter(b => b.level !== undefined);
            Composite.remove(window.world, bodies);
            
            isGameOver = false; setGlobalPause(false); 
            updatePreview();
        }
    };
</script>
</body>
</html>
